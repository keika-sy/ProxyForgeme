[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proxyforge"
version = "0.1.0"
description = "Auto-collected, validated, ranked free proxy lists with uptime scoring and a stats dashboard"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "aiohttp>=3.9",
    "aiohttp-socks>=0.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
proxyforge = "proxyforge.cli:main"

[tool.setuptools.packages.find]
include = ["proxyforge*"]
